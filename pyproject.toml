[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abadan-cbm"
version = "0.1.0"
description = "CBM Smart Dashboard for Abadan Petrochemical — backend services + ML"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.19",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "aiokafka>=0.10",
    "asyncio-mqtt>=0.16",
    "influxdb-client>=1.44",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "PyWavelets>=1.6",
    "joblib>=1.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "websockets>=12.0",
    "apscheduler>=3.10",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
torch = ["torch>=2.2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["services*", "ml*"]
